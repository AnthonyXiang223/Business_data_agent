[project]
name = "research_deepagent"
version = "0.1.0"
description = "业务数据分析 Agent —— deepagents 单 Agent（取数 5 工具 + create_chart），由 langgraph dev 服务。"
authors = [{ name = "Your Name" }]
requires-python = ">=3.12"
dependencies = [
    # --- 核心框架与基础设施（deepagents / langchain / OpenAI 兼容网关 / dev server） ---
    "deepagents>=0.5.3",
    "langchain>=1.0",
    "langchain-openai>=0.3",
    "python-dotenv>=1.0",
    "langgraph-cli[inmem]>=0.4",
    # --- demo_agent 主线依赖（数据分析 Agent / 工具层 / 评估集） ---
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "numpy>=2.5.2",
    "sqlglot>=30.17.0",
    "pyyaml>=6.0.3",
    "langsmith>=0.11.0",
    "json-repair>=0.63",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
