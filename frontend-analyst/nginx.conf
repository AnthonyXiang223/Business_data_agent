# nginx 站点配置：静态文件 + API 反代（SSE 兼容）
server {
    listen 80;

    # ---------- 静态产物 ----------
    # root：dist 拷贝到的目录
    # try_files：SPA 路由回退——/sessions/xxx 这类前端路由在磁盘上没有
    #           对应文件，全部回退到 index.html 交给前端路由处理
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反代到 server 容器 ----------
    # compose 网络内容器间用"服务名"互访：server 会解析成 server 容器的 IP
    # proxy_pass 结尾的 / 会剥掉 /api 前缀：/api/chat → server 的 /chat
    location /api/ {
        proxy_pass http://server:8000/;

        # SSE 长连接三件套（缺一不可）：
        # 1. proxy_http_version 1.1 —— 默认 1.0 是短连接语义，SSE 是长流
        # 2. proxy_buffering off —— nginx 默认把上游响应攒够再吐给客户端，
        #    SSE 会退化成"等全部完成才一次性返回"（本地 X-Accel-Buffering
        #    防的是同一件事，到了真 nginx 这里是正主）
        # 3. proxy_read_timeout —— 上游超过该时长无数据 nginx 会断流；
        #    LLM 长考+工具执行可能 5-10 分钟没输出，拉到 1 小时
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        # 透传客户端信息（审计中间件记 client_host 用）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
