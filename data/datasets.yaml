# 数据集元数据：列级口径 + 指标口径（Agent 计算指标的权威来源）
# - 7 个数据集同 schema（2024 电商交易，12 中文字段），列口径用 YAML 锚点共享
# - 指标参考SQL 的表名必须等于数据集名（护栏要求），因此逐数据集声明
# - 口径变更走 git review；参考SQL 必须能直接在本数据集上执行

阿里1688:
  description: 阿里巴巴1688平台 2024 年全年交易明细（1000 条购买记录，用户/商品/交易三维度）
  columns: &platform_columns
    用户ID: 用户唯一标识（U1000-U9999），同一用户可有多条购买记录
    用户姓名: 随机生成的模拟姓名，仅用于展示，不参与统计口径
    商品ID: 商品唯一标识（P10000-P99999）
    商品名称: 具体商品名称
    商品类别: 商品一级分类，共 7 类：电子产品/服装/家居/书籍/美妆/运动/玩具
    单价: 商品单件销售价格（人民币元）
    购买时间: 交易时间（字符串 YYYY-MM-DD HH:MM:SS，2024 全年）；按日期统计时需 TRY_CAST(购买时间 AS DATE)
    购买数量: 该条记录购买件数（1-5 件）
    消费金额: 该条记录总金额（= 单价 × 购买数量），GMV 与客单价的计算基础
    用户城市: 用户所在城市（12 个主要城市）
    用户性别: 用户性别（男/女）
    用户年龄: 用户年龄（18-65 岁）
  metrics:
    销售额_GMV:
      定义: 所有购买记录的消费金额合计（消费金额为 NULL 的记录不计入），反映整体销售规模
      参考SQL: SELECT SUM(消费金额) AS gmv FROM 阿里1688 WHERE 消费金额 IS NOT NULL
    销售件数:
      定义: 所有购买记录的购买数量合计
      参考SQL: SELECT SUM(购买数量) AS total_qty FROM 阿里1688
    客单价:
      定义: 平均每条购买记录的消费金额 = 消费金额合计 ÷ 购买记录数。注意：本数据集无订单ID，"单"按一条购买记录计
      参考SQL: SELECT CAST(SUM(消费金额) AS DOUBLE) / COUNT(*) AS 客单价 FROM 阿里1688 WHERE 消费金额 IS NOT NULL
    复购率:
      定义: 购买次数不少于 2 次的用户数 ÷ 总用户数（均按用户ID去重）
      参考SQL: SELECT CAST(COUNT(DISTINCT CASE WHEN cnt >= 2 THEN 用户ID END) AS DOUBLE) / COUNT(DISTINCT 用户ID) AS 复购率 FROM (SELECT 用户ID, COUNT(*) AS cnt FROM 阿里1688 GROUP BY 用户ID)
    人均消费金额:
      定义: 消费金额合计 ÷ 去重用户数
      参考SQL: SELECT CAST(SUM(消费金额) AS DOUBLE) / COUNT(DISTINCT 用户ID) AS 人均消费 FROM 阿里1688 WHERE 消费金额 IS NOT NULL

